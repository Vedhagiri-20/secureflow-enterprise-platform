<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/report/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Reports | SecureFlow</title>
    <link rel="stylesheet" href="report.css">
    <link rel="stylesheet" href="../assets/secureflow-premium.css">
    <link rel="stylesheet" href="../assets/secureflow-contrast.css">
    <link rel="stylesheet" href="../assets/secureflow-unified.css">

    <script src="/assets/api-config.js"></script>
    <script src="/assets/secureflow-runtime.js"></script>
</head>
<body>

<div class="page">

    <header class="topbar">

        <div>
            <h2>SecureFlow International Bank</h2>
            <p>Employee Reports</p>
        </div>

        <a
            href="../dashboard/employee/employee-dashboard.html"
            class="back-button"
        >
            Back to Dashboard
        </a>

    </header>

    <main>

        <section class="intro">

            <span class="badge">Reports</span>

            <h1>Workflow Report</h1>

            <p>
                Review applications handled by the currently logged-in
                employee.
            </p>

        </section>


        <section class="stats">

            <div class="stat-card">
                <span>Total</span>
                <strong id="totalWorkflows">0</strong>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <strong id="pendingCount">0</strong>
            </div>

            <div class="stat-card">
                <span>Approved</span>
                <strong id="approvedCount">0</strong>
            </div>

            <div class="stat-card">
                <span>Rejected</span>
                <strong id="rejectedCount">0</strong>
            </div>

        </section>


        <section class="card">

            <h2>Loan Type Breakdown</h2>

            <div
                id="loanBreakdown"
                class="loan-grid"
            ></div>

        </section>


        <section class="card">

            <div class="table-header">

                <div>
                    <h2>Applications</h2>
                    <p id="employeeEmail"></p>
                </div>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search applications..."
                >

            </div>

            <p id="message"></p>

            <div class="table-wrapper">

                <table>

                    <thead>
                    <tr>
                        <th>Application</th>
                        <th>Loan Type</th>
                        <th>Applicant</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Manager</th>
                        <th>Submitted</th>
                    </tr>
                    </thead>

                    <tbody id="reportTableBody"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>
<script src="report.js"></script>

</body>
</html>
